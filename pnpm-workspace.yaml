packages:
  - "packages/**/*"

# Security overrides for transitive dependencies (keep in sync with "overrides" in package.json for npm).
overrides:
  # CVE-2025-62610, CVE-2026-22817, CVE-2026-22818, CVE-2026-29045, CVE-2026-54290 (via sst > opencontrol, pinned to 4.7.4)
  hono: 4.12.25
  # CVE-2025-66414 (via sst > opencontrol, pinned to 1.6.1)
  "@modelcontextprotocol/sdk": 1.29.0
  # Compatibility pin for the CVE-2025-66414 override above: sdk@1.29.0 imports "zod/v4" (peer zod ^3.25 || ^4.0),
  # which opencontrol's pinned zod@3.24.2 does not provide. 3.25.x keeps the zod v3 API at the package root.
  opencontrol>zod: 3.25.76
  # CVE-2026-90711 (via @modelcontextprotocol/sdk > express; express@5.2.1 is latest and still allows 2.0.7)
  proxy-addr: 2.0.8
  # CVE-2026-93749 (via vitest > vite > postcss)
  source-map-js: 1.2.2
